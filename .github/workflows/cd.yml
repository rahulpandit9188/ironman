name: Deploy to EC2

on:
  workflow_run:
    workflows:
      - Django CI
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    env:
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/ironman-web

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.event.workflow_run.head_sha }}

      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/ironman
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export WEB_IMAGE="${{ env.WEB_IMAGE }}:latest"
            # Keep FRONTEND_IMAGE from server .env — do not overwrite it here.
            set -a
            . ./.env
            set +a
            export WEB_IMAGE="${{ env.WEB_IMAGE }}:latest"
            docker compose -f docker-compose.prod.yml pull web
            docker compose -f docker-compose.prod.yml up -d web
            docker compose -f docker-compose.prod.yml ps
